<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>翻译 + 发音（修复版）</title>
<style>
:root{
  --red:#E8453C;
  --red-dark:#c93a32;
  --bg:#FAF7F2;
  --card:#fff;
  --text:#1a1a1a;
  --muted:#888;
  --border:#e5e5e5;
  --radius:10px;
  --shadow:0 2px 12px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:40px 16px;
  min-height:100vh;
}

/* 容器 */
.container{max-width:680px;margin:0 auto}

/* 标题 */
h2{
  text-align:center;
  font-size:1.4rem;
  font-weight:600;
  margin-bottom:24px;
  color:var(--text);
}

/* 语言选择行 */
.lang-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
  background:var(--card);
  padding:12px 14px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.lang-row select{
  flex:1;
  padding:9px 12px;
  font-size:14px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#fff;
  color:var(--text);
  outline:none;
  cursor:pointer;
  transition:border-color .2s;
}
.lang-row select:focus{border-color:var(--red)}
.swap-btn{
  width:38px;height:38px;
  border:none;border-radius:50%;
  background:var(--red);color:#fff;
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .3s,background .2s;
  flex-shrink:0;
}
.swap-btn:hover{background:var(--red-dark)}
.swap-btn.spin{transform:rotate(180deg)}

/* 输入区 */
.input-wrap{
  position:relative;
  margin-bottom:14px;
}
.input-wrap textarea{
  width:100%;
  min-height:100px;
  padding:14px 16px;
  font-size:15px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--card);
  color:var(--text);
  outline:none;
  resize:vertical;
  line-height:1.6;
  transition:border-color .2s,box-shadow .2s;
  box-shadow:var(--shadow);
}
.input-wrap textarea:focus{
  border-color:var(--red);
  box-shadow:0 0 0 3px rgba(232,69,60,.1);
}

/* 快捷语言标签 */
.quick-langs{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:14px;
}
.quick-langs span{
  display:inline-block;
  padding:4px 12px;
  font-size:12px;
  border:1px solid var(--border);
  border-radius:20px;
  background:#fff;
  color:var(--muted);
  cursor:pointer;
  transition:all .2s;
}
.quick-langs span:hover{
  border-color:var(--red);
  color:var(--red);
}
.quick-langs span.active{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}

/* 按钮行 */
.btn-row{
  display:flex;
  gap:10px;
  margin-bottom:18px;
  flex-wrap:wrap;
}
.btn{
  padding:10px 20px;
  font-size:14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:all .2s;
  font-weight:500;
}
.btn-primary{
  background:var(--red);
  color:#fff;
  flex:1;
  min-width:120px;
}
.btn-primary:hover{background:var(--red-dark)}
.btn-speak{
  background:#fff;
  border:1px solid var(--red) !important;
  color:var(--red);
}
.btn-speak:hover{background:rgba(232,69,60,.06)}
.btn-stop{
  background:#f5f5f5;
  color:#555;
  border:1px solid #ddd !important;
}
.btn-stop:hover{background:#eee}

/* 语速音调 */
.voice-controls{
  display:flex;
  gap:16px;
  margin-bottom:18px;
  background:var(--card);
  padding:12px 14px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  align-items:center;
}
.voice-controls label{
  font-size:13px;
  color:var(--muted);
  white-space:nowrap;
}
.voice-controls input[type=range]{
  flex:1;
  accent-color:var(--red);
}

/* 结果区 */
.result-box{
  background:var(--card);
  border-radius:var(--radius);
  padding:16px 18px;
  min-height:80px;
  box-shadow:var(--shadow);
  margin-bottom:12px;
}
.result-label{
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:6px;
}
.result-text{
  font-size:16px;
  line-height:1.7;
  color:var(--text);
  white-space:pre-wrap;
  word-break:break-word;
}
.result-text.placeholder{color:#bbb;font-size:14px}

/* 状态栏 */
.status-bar{
  font-size:12px;
  color:var(--muted);
  text-align:center;
  min-height:18px;
  margin-bottom:8px;
}
.status-bar.error{color:var(--red)}
.status-bar.success{color:#16a34a}

/* 提示区 */
.hint-box{
  background:rgba(232,69,60,.04);
  border:1px solid rgba(232,69,60,.12);
  border-radius:var(--radius);
  padding:14px 16px;
  font-size:12px;
  color:#666;
  line-height:1.8;
}
.hint-box strong{color:var(--red)}

/* 检测结果显示 */
.detected-info{
  font-size:12px;
  color:#16a34a;
  margin-bottom:8px;
  min-height:16px;
}




/* 广告容器样式 */

.ad-container {
    max-width: 1400px;     /* 广告外层最大宽，和你 main 的 1400 一致 ✅ */
    margin: 1.5rem auto;   /* 上下 1.5rem 外边距，左右自动居中 ✅ */
    padding: 0.25rem 0;       /* 上下留 0.25rem 呼吸感 ✅ */
}

.ad-wrapper {
    background: rgba(255, 255, 255, 0.95); /* 白底微透，和卡片 .card 同色系 ✅ */
    backdrop-filter: blur(10px);           /* 毛玻璃（仅 WebKit 强支持） */
    border-radius: 4px;                   /* 圆角比卡片(10px)略大，区分层级 ✅ */
    padding: 0.25rem 0;                         /* 上下 0.25rem 内边距 ✅ */
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); /* 悬浮感，比卡片深一点 ✅ */
}

.ad-label {
    font-size: 0.75rem;     /* 12px（你根 16px 下 .75rem），合规 ✅ */
    color: #94a3b8;         /* 浅蓝灰，弱存在感 ✅ */
    margin-bottom: 0.25rem;  /* 和广告间距 ✅ */
    text-align: right;      /* 标在右上/右，不抢左文 ✅ */
}














</style>
</head>
<body>

    <!-- 顶部广告位 -->
    <div class="ad-container">
        <div class="ad-wrapper">
            <div class="ad-label">广告</div>
            <!-- Google AdSense_自适应展示广告 -->
            <ins class="adsbygoogle"
                style="display:block"
                data-ad-client="ca-pub-6434243103158481"
                data-ad-slot="4856101005"
                data-ad-format="auto"
                data-full-width-responsive="true"></ins>
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6434243103158481"
                crossorigin="anonymous"></script>
            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>







<div class="container">
  <h2>🌐 翻译 + 🔊 发音</h2>

  <!-- 语言选择 -->
  <div class="lang-row">
    <select id="sl">
      <option value="zh-CN">🇨🇳 中文</option>
      <option value="en" selected>🇬🇧 English</option>
      <option value="ja">🇯🇵 日本語</option>
      <option value="ko">🇰🇷 한국어</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="es">🇪🇸 Español</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="th">泰语</option>
    </select>
    <button class="swap-btn" id="swapBtn" title="交换语言">⇄</button>
    <select id="tl">
      <option value="zh-CN" selected>🇨🇳 中文</option>
      <option value="en">🇬🇧 English</option>
      <option value="ja">🇯🇵 日本語</option>
      <option value="ko">🇰🇷 한국어</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="es">🇪🇸 Español</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="th">泰语</option>
    </select>
  </div>

  <!-- 快捷目标语言 -->
  <div class="quick-langs" id="quickLangs">
    <span data-lang="zh-CN">中</span>
    <span data-lang="en" class="active">EN</span>
    <span data-lang="ja">日</span>
    <span data-lang="ko">韩</span>
    <span data-lang="fr">法</span>
    <span data-lang="de">德</span>
    <span data-lang="es">西</span>
    <span data-lang="ru">俄</span>
    <span data-lang="th">泰</span>
  </div>

  <!-- 原文输入 -->
  <div class="input-wrap">
    <textarea id="src" placeholder="输入要翻译的文字…（如：Hello world）"></textarea>
  </div>

  <!-- 按钮 -->
  <div class="btn-row">
    <button class="btn btn-primary" id="translateBtn">① 翻译</button>
    <button class="btn btn-speak" id="speakSrcBtn">🔊 朗读原文</button>
    <button class="btn btn-speak" id="speakDstBtn">🔊 朗读译文</button>
    <button class="btn btn-stop" id="stopBtn">⏹ 停止</button>
  </div>

  <!-- 语音控制 -->
  <div class="voice-controls">
    <label>语速</label>
    <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1">
    <label id="rateVal">1.0x</label>
    <label style="margin-left:12px">音调</label>
    <input type="range" id="pitchRange" min="0.5" max="2" step="0.1" value="1">
    <label id="pitchVal">1.0</label>
  </div>

  <!-- 检测结果 -->
  <div class="detected-info" id="detectedInfo"></div>

  <!-- 译文结果 -->
  <div class="result-box">
    <div class="result-label">译文</div>
    <div class="result-text placeholder" id="result">译文将显示在这里…</div>
  </div>

  <!-- 状态 -->
  <div class="status-bar" id="status"></div>

  <!-- 提示 -->
  <div class="hint-box">
    <strong>使用步骤：</strong><br>
    ① 选择原文语言 + 目标语言（默认英文→中文）<br>
    ② 输入文字 → 点「翻译」→ 看译文显示<br>
    ③ 点「🔊 朗读译文」听发音<br>
    <strong>注意：</strong>MyMemory 不支持 auto 检测，请明确选择原文语言。如遇网络错误，请检查广告拦截插件或换网络。
  </div>
</div>

<script>
// ============ 状态 ============
var lastTranslated = "";
var detectedLang = "";

// ============ 工具函数 ============
function setStatus(msg, type){ 
  var el = document.getElementById('status');
  el.innerText = msg;
  el.className = 'status-bar' + (type ? ' '+type : '');
}
function setDetected(msg){ 
  document.getElementById('detectedInfo').innerText = msg; 
}
function $(id){ return document.getElementById(id); }

// ============ 语言交换 ============
$('swapBtn').addEventListener('click', function(){
  var sl = $('sl'), tl = $('tl');
  var tmp = sl.value;
  sl.value = tl.value;
  tl.value = tmp;
  this.classList.add('spin');
  setTimeout(function(){this.classList.remove('spin')}.bind(this), 300);
  // 同步快捷标签高亮
  updateQuickActive(tl.value);
});

// ============ 快捷语言 ============
document.querySelectorAll('#quickLangs span').forEach(function(el){
  el.addEventListener('click', function(){
    $('tl').value = this.dataset.lang;
    updateQuickActive(this.dataset.lang);
  });
});
function updateQuickActive(lang){
  document.querySelectorAll('#quickLangs span').forEach(function(s){
    s.classList.toggle('active', s.dataset.lang === lang);
  });
}

// ============ 语速/音调 ============
$('rateRange').addEventListener('input', function(){
  $('rateVal').innerText = parseFloat(this.value).toFixed(1) + 'x';
});
$('pitchRange').addEventListener('input', function(){
  $('pitchVal').innerText = parseFloat(this.value).toFixed(1);
});

// ============ 翻译（核心修复）============
$('translateBtn').addEventListener('click', function(){
  var q = $('src').value.trim();
  if(!q){ alert('请先输入要翻译的文字'); return; }

  var sl = $('sl').value;
  var tl = $('tl').value;

  // 关键修复：MyMemory 不支持 auto，必须明确源语言
  if(sl === tl){ alert('源语言和目标语言不能相同'); return; }

  var resultEl = $('result');
  resultEl.className = 'result-text';
  resultEl.innerText = '翻译中…';
  setStatus('正在请求翻译…');
  setDetected('');

  // 用 Google gtx 先检测语言（免费、无需 Key）
  detectLanguage(q, function(detected){
    if(detected && detected !== sl){
      setDetected('🔍 检测到原文语言：' + detected + '（当前选择：' + sl + '）');
    }
    // 用检测到的语言优先（如果用户在 auto 模式下）
    var useSl = sl;
    if(detected && sl !== detected){
      // 不自动覆盖用户选择，仅提示
    }
    doMyMemory(q, useSl, tl);
  });
});

function detectLanguage(text, cb){
  // Google translate_a/single 检测
  var url = 'https://translate.google.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=at&q=' + encodeURIComponent(text.slice(0,200));
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onload = function(){
    try{
      var arr = JSON.parse(xhr.responseText);
      // 返回格式 [[...],"en",...] 第2个元素是检测语言
      var lang = arr && arr[2] ? arr[2] : '';
      cb(lang);
    }catch(e){ cb(''); }
  };
  xhr.onerror = function(){ cb(''); };
  xhr.send();
}

function doMyMemory(q, sl, tl){
  // 关键：langpair 格式必须是 "源|目标"，不能为 auto
  var url = 'https://api.mymemory.translated.net/get?q='
    + encodeURIComponent(q) + '&langpair=' + sl + '|' + tl;

  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onload = function(){
    if(xhr.status < 200 || xhr.status >= 300){
      $('result').innerText = '翻译失败';
      setStatus('HTTP 错误: ' + xhr.status, 'error');
      alert('翻译请求失败，HTTP状态: ' + xhr.status + '\n\n如为0/网络错误，请检查广告拦截插件或网络');
      return;
    }
    try{
      var d = JSON.parse(xhr.responseText);
      if(d && d.responseData && d.responseData.translatedText){
        lastTranslated = d.responseData.translatedText;
        $('result').innerText = lastTranslated;
        setStatus('翻译成功 ✓  ' + sl + ' → ' + tl, 'success');
      } else {
        $('result').innerText = '翻译失败：无返回文本';
        setStatus('异常: ' + JSON.stringify(d).slice(0,150), 'error');
      }
    }catch(e){
      $('result').innerText = '解析失败';
      setStatus('JSON 解析错误: ' + e, 'error');
    }
  };
  xhr.onerror = function(){
    $('result').innerText = '网络错误';
    setStatus('网络错误：无法访问 api.mymemory.translated.net', 'error');
    alert('网络错误\n\n常见原因：\n1. 广告/脚本拦截插件（最常见）\n2. 没联网\n3. 公司/校园网防火墙\n\n建议：关闭拦截插件或换手机热点');
  };
  xhr.send();
}

// ============ 朗读 ============
function speak(text, lang){
  if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音合成 TTS'); return; }
  if(!text){ alert('没有可朗读的内容'); return; }

  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = parseFloat($('rateRange').value);
  u.pitch = parseFloat($('pitchRange').value);
  speechSynthesis.speak(u);
  setStatus('正在朗读（' + lang + '）', 'success');
}

$('speakSrcBtn').addEventListener('click', function(){
  var text = $('src').value.trim();
  if(!text){ alert('请先输入原文'); return; }
  speak(text, $('sl').value);
});

$('speakDstBtn').addEventListener('click', function(){
  if(!lastTranslated){ alert('请先完成翻译'); return; }
  speak(lastTranslated, $('tl').value);
});

$('stopBtn').addEventListener('click', function(){
  speechSynthesis.cancel();
  setStatus('已停止朗读');
});

// ============ 回车快捷翻译 ============
$('src').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    $('translateBtn').click();
  }
});
</script>

</body>
</html>
