<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 移动端地基 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>响应式模板</title>
  <link rel="stylesheet" href="test.css">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="nav">
    <div class="container nav__inner">
      <span class="logo">我的站点</span>
      <nav class="nav__links">
        <a href="#">首页</a>
        <a href="#">文章</a>
        <a href="#">关于</a>
      </nav>
    </div>
  </header>

  <!-- 主体内容 -->
  <main class="container">
    <article class="content">
      <h1>标题</h1>
      <p>正文内容……</p>

      <!-- 卡片列表（响应式栅格） -->
      <div class="grid">
        <div class="card">
          <div class="card__icon">📄</div>
          <h3>卡片标题 1</h3>
          <p>卡片描述文字。</p>
        </div>
        <div class="card">
          <div class="card__icon">⚙️</div>
          <h3>卡片标题 2</h3>
          <p>卡片描述文字。</p>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
