<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>正协导航 - 单卡不溢出定稿</title>
<style>
:root { --gold:#FFC107; --ivory:#FAF7F2; --red:#E8453C; }
body { font-family: sans-serif; padding:40px; background:var(--ivory); }

.card {
  width: 320px;
  background: #fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:16px;
}

.head { display:flex; gap:12px; align-items:flex-start; }

.icon {
  width:48px; height:48px;
  border-radius:50%; background:var(--gold);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}

/* 关键：文字块变 flex column，子项可压 */
.text {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.title {
  margin:0 0 4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
  min-width:0;
  padding:4px 6px;
  border-radius:6px;
}
.desc {
  margin:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
  min-width:0;
  padding:4px 6px;
  border-radius:6px;
}

/* 悬停无条横滑 */
.title:hover,.desc:hover,.tags:hover,.links:hover {
  background: rgba(255,193,7,0.2);
  text-overflow:clip;
  overflow:hidden;
  overflow-y:hidden;
}

.tags { display:flex; gap:6px; margin:12px 0; white-space:nowrap; overflow:hidden; }
.tag { padding:2px 8px; border:1px solid var(--gold); border-radius:4px; white-space:nowrap; flex-shrink:0; }

.links { display:flex; gap:8px; margin-top:auto; white-space:nowrap; overflow:hidden; }
.link { padding:4px 10px; background:var(--ivory); color:var(--red); text-decoration:none; white-space:nowrap; flex-shrink:0; }
</style>
</head>

<body>
<div class="card">
  <div class="head">
    <div class="icon">G</div>
    <div class="text">
      <div class="title">这是一个非常非常长的名称会被直接截断不画省略号</div>
      <div class="desc">这是一段很长的描述文字也会被直接截断不画省略号</div>
    </div>
  </div>
  <div class="tags">
    <span class="tag">代码</span><span class="tag">开源</span><span class="tag">工具</span><span class="tag">平台</span>
    <span class="tag">代码</span><span class="tag">开源</span><span class="tag">工具</span><span class="tag">平台</span>
    <span class="tag">代码</span><span class="tag">开源</span><span class="tag">工具</span><span class="tag">平台</span>
    <span class="tag">代码</span><span class="tag">开源</span><span class="tag">工具</span><span class="tag">平台</span>
    <span class="tag">代码</span><span class="tag">开源</span><span class="tag">工具</span><span class="tag">平台</span>
    <span class="tag">代码</span><span class="tag">开源</span><span class="tag">工具</span><span class="tag">平台</span>
  </div>
  <div class="links">
    <a class="link">官网入口</a><a class="link">文档中心</a><a class="link">社区讨论</a>
    <a class="link">官网入口</a><a class="link">文档中心</a><a class="link">社区讨论</a>
    <a class="link">官网入口</a><a class="link">文档中心</a><a class="link">社区讨论</a>
    <a class="link">官网入口</a><a class="link">文档中心</a><a class="link">社区讨论</a>
    <a class="link">官网入口</a><a class="link">文档中心</a><a class="link">社区讨论</a>

  </div>
</div>

<script>
['title','desc','tags','links'].forEach(cls => {
  const el = document.querySelector('.'+cls);
  el.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      el.scrollLeft += e.deltaY;
    }
  }, {passive: false});
});
</script>
</body>
</html>
