<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="简洁高效的导航网站，一键直达常用工具与资源" />
  <title>导航站 · 一键直达</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />

  <!-- ============================================================
       百度统计代码占位
       启用方式：在 js/config.js 中将 baiduAnalytics.enabled 设为 true
       并填入你的统计 ID（如 hm.baidu.com?xxxxxxxxxxxx 中的 xxxxxxxxxx）
       ============================================================ -->
  <!--
  <script>
    var _hmt = _hmt || [];
    (function() {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?你的百度统计ID";
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    })();
  </script>
  -->
  <!-- ============================================================ -->
</head>
<body>
  <!-- 顶部广告位 — 大图卡片样式 (Google AdSense) -->
  <div id="ad-top" class="ad-slot ad-top" data-ad-slot="top">
    <div class="ad-card">
      <span class="ad-card-label">
        <span class="ad-badge">AD</span>
        广告位 · 配置 Google AdSense 后自动展示
      </span>
    </div>
  </div>

  <!-- 顶部导航栏 — 搜索框置顶 -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="logo">
        <span class="logo-icon">⚜</span>
        <span class="logo-text">导航站</span>
      </div>

      <!-- 搜索框移至顶部导航栏 -->
      <div class="header-search-box">
        <div class="search-engine-select">
          <select id="search-engine" aria-label="选择搜索引擎">
            <!-- 选项由 JS 动态渲染 -->
          </select>
        </div>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="搜索..."
          autocomplete="off"
        />
        <button id="search-btn" class="search-btn" aria-label="搜索">
          🔍
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 分类标签筛选栏 -->
    <section class="tabs-section">
      <div class="category-tabs-wrapper">
        <div id="category-tabs" class="category-tabs">
          <!-- 标签由 JS 动态渲染 -->
        </div>
        <div class="tabs-fade-left"></div>
        <div class="tabs-fade-right"></div>
      </div>
    </section>

    <!-- 导航分类 -->
    <section id="nav-container" class="nav-container">
      <!-- 导航分类由 JS 动态渲染 -->
    </section>
  </main>

  <!-- 底部广告位 — 大图卡片样式 (Google AdSense) -->
  <div id="ad-bottom" class="ad-slot ad-bottom" data-ad-slot="bottom">
    <div class="ad-card">
      <span class="ad-card-label">
        <span class="ad-badge">AD</span>
        广告位 · 配置 Google AdSense 后自动展示
      </span>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="current-year"></span> 导航站 · 尊贵之选</p>
      <p class="footer-sub">基于 GitHub Pages 构建</p>
    </div>
  </footer>

  <!-- 配置与主逻辑 -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
